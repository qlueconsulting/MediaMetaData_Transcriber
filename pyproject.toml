[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "media-metadata-transcriber"
version = "1.0.0"
description = "High-performance GPU-accelerated video metadata extraction, audio processing, and transcription microservice"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "MediaMetaData Team" }
]
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "python-multipart>=0.0.9",
    "yt-dlp>=2024.8.6",
    "faster-whisper>=1.0.1",
    "groq>=0.5.0",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
