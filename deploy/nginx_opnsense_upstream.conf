# ==============================================================================
# OPNsense Nginx Plugin / Reverse Proxy Configuration Snippet
# For MediaMetaData_Transcriber running on internal LAN server: 192.168.1.50:8000
# ==============================================================================

upstream transcriber_backend {
    server 127.0.0.1:8000; # Or internal LAN IP e.g. 192.168.1.50:8000
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name transcriber.local.home.arpa;

    # SSL certificates managed via OPNsense ACME / Let's Encrypt plugin
    # ssl_certificate /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    # Operational criteria guardrail: 25MB audio limit -> Allow up to 50MB for HTTP payloads
    client_max_body_size 50M;

    # Crucial timeouts: Transcription of 15-20 min audio can take 30-90 seconds on RTX 2060 Super
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    # Pass residential IP and connection headers
    location / {
        proxy_pass http://transcriber_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Disable buffering for real-time progress / fast streaming
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
